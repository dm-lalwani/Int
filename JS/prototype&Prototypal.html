<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype & Prototypal Inheritance</title>
</head>

<body>
  <h1>Understanding Prototype & Prototypal Inheritance</h1>

  <script>
    let arr = ["Dinesh", "Mahesh"];

    let obj = {
      name: "Dinesh",
      city: "Nashik",
      getInfo: function () {
        console.log(this.name + " from " + this.city);
      },
    }

    Function.prototype.greet = function () {
      console.log("Hello" + this.name);
    }

    function fun() { } // any function will have access to greet method because of prototype

    // Protoypal Inheritance

    // let obj2 = {
    //   name: "Mahesh",
    // }

    // Never do this in real code, this is just for demonstration
    // obj2.__proto__ = obj; // obj2 inherits from obj

    //Production level code
    let obj2 = Object.create(obj); // obj2 inherits from obj
    obj2.name = "Mahesh"; // obj2 has its own name property, but it can also access properties of obj
  </script>
</body>

</html>
