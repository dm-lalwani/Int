<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Delegation</title>
</head>
<body>
  <ul id="itemList">
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
  </ul>

  <div id="form">
    <input type="text" id="firstName" placeholder="Enter first name" data-uppercase>
    <input type="text" id="lastName" placeholder="Enter last name">
    <input type="text" id="pan" placeholder="Enter PAN number">
  </div>

  <script>
    const itemList = document.getElementById('itemList');

    // Event delegation: Attach a single event listener to the parent element
    itemList.addEventListener('click', (event) => {
      if (event.target && event.target.nodeName === 'LI') {
        console.log(`Clicked on: ${event.target.textContent}`);
      }
    });

    const form = document.getElementById('form');
    form.addEventListener('keyup', (event) => {
      const target = event.target;
      if (target.dataset.uppercase !== undefined) {
        target.value = target.value.toUpperCase();
      }
    });
  </script>
</body>
</html>
